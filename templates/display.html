<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caption Display</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { display: flex; align-items: flex-start; justify-content: flex-start; }

    /* Fixed-height block, text starts at the top, so the first line
       stays put when the second line appears or disappears */
    #captions {
      width: 100%;
      min-height: 50vh;
      box-sizing: border-box;
      padding: 4vw;
      text-align: left;
    }
    .line { line-height: 0.8; white-space: pre-line; }
    #line0 { font-size: var(--size, 1.5vw); color: #fff; }
    #line1 { font-size: var(--size, 1.5vw); color: #ddd; margin-top: 0.6em; }

    #status { position: fixed; top: 40%; width: 100%; text-align: center;
              color: #444; font-size: 2vw; }
    #status:empty { display: none; }

    #debug {
      position: fixed;
      left: 8px;
      bottom: 8px;
      font: 14px monospace;
      color: #0f0;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="captions">
    <div id="line0" class="line"></div>
    <div id="line1" class="line"></div>
  </div>
  <div id="status">Waiting for controller...</div>
  <div id="debug"></div>

  <script>
    const lineEls = [document.getElementById("line0"), document.getElementById("line1")];
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const params = new URLSearchParams(location.search);
    const debugOn = params.has("debug");
    // ?sync makes the lower lines follow the first line's cue changes
    const syncOn = true;

    // Optional: ?size=3 (top line) and ?size2=2.5 (second line), in vw units
    const size1 = parseFloat(params.get("size"));
    const size2 = parseFloat(params.get("size2"));
    if (size1 > 0) document.documentElement.style.setProperty("--size", size1 + "vw");
    if (size2 > 0) document.documentElement.style.setProperty("--size2", size2 + "vw");

    let tracks = [];            // [{lang, segments, ...}, ...] in display order
    let lastIdx = [-2, -2];     // last shown segment index per line
    let aligned = [];           // aligned[k][i] = cue in track k matching track 0's cue i
    let videoId = null;
    let loading = false;
    let retryAfter = 0;
    let pollCount = 0, lastPollAt = 0, lastError = "";
    // Last known playback state, plus when we received it
    let base = { t: 0, playing: false, at: performance.now() };

    async function loadTracks(id) {
      loading = true;
      try {
        const res = await fetch("/api/captions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: id })
        });
        const data = await res.json();
        if (res.ok) {
          tracks = data.tracks || [{ lang: "?", segments: data.segments }];
          buildAlignment();
          videoId = id;
          lastIdx = [-2, -2];
          statusEl.textContent = "";
          lineEls.forEach(e => e.textContent = "");
        } else {
          statusEl.textContent = data.error || "Failed to load captions.";
          retryAfter = performance.now() + 3000;
        }
      } catch (e) {
        statusEl.textContent = "Could not reach the server.";
        retryAfter = performance.now() + 3000;
      }
      loading = false;
    }

    async function poll() {
      try {
        const s = await (await fetch("/api/state", { cache: "no-store" })).json();
        base = { t: s.t, playing: s.playing, at: performance.now() };
        pollCount++;
        lastPollAt = performance.now();
        lastError = "";
        if (s.video_id && s.video_id !== videoId && !loading && performance.now() >= retryAfter) {
          await loadTracks(s.video_id);
        }
      } catch (e) {
        // server unreachable; keep showing the last caption and try again
        lastError = String(e);
      }
    }

    // Binary search: last segment whose start time is <= t
    function findIndex(segs, t) {
      let lo = 0, hi = segs.length - 1, ans = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (segs[mid].seconds <= t) { ans = mid; lo = mid + 1; }
        else hi = mid - 1;
      }
      return ans;
    }

    // For each cue of the first track, find the cue in every other track that
    // overlaps it the most. Used by ?sync so all lines change together.
    function buildAlignment() {
      aligned = [];
      if (tracks.length < 2) return;
      const primary = tracks[0].segments;
      for (let k = 1; k < tracks.length; k++) {
        const segs = tracks[k].segments;
        const map = new Array(primary.length).fill(-1);
        for (let i = 0; i < primary.length; i++) {
          const s0 = primary[i].seconds;
          const e0 = s0 + primary[i].duration;
          let best = -1, bestOverlap = 0;
          for (let j = Math.max(0, findIndex(segs, s0) - 2); j < segs.length && segs[j].seconds < e0; j++) {
            const overlap = Math.min(e0, segs[j].seconds + segs[j].duration) - Math.max(s0, segs[j].seconds);
            if (overlap > bestOverlap) { bestOverlap = overlap; best = j; }
          }
          map[i] = best;
        }
        aligned[k] = map;
      }
    }

    // Between polls, advance the clock locally so captions stay smooth
    function render() {
      const t = base.t + (base.playing ? (performance.now() - base.at) / 1000 : 0);

      if (videoId) {
        // Current cue of the first track, needed in sync mode
        let i0 = -1;
        if (syncOn && tracks[0]) {
          const p = tracks[0].segments;
          i0 = findIndex(p, t);
          if (i0 >= 0 && t > p[i0].seconds + p[i0].duration) i0 = -1;
        }
        for (let k = 0; k < lineEls.length; k++) {
          const segs = tracks[k] ? tracks[k].segments : [];
          let i;
          if (syncOn && k > 0) {
            i = (i0 >= 0 && aligned[k]) ? aligned[k][i0] : -1;
          } else {
            i = findIndex(segs, t);
            if (i >= 0 && t > segs[i].seconds + segs[i].duration) i = -1;
          }
          if (i !== lastIdx[k]) {
            lastIdx[k] = i;
            lineEls[k].textContent = i >= 0 ? segs[i].text : "";
          }
        }
      }

      if (debugOn) {
        const trackInfo = tracks.map((tr, k) =>
          "  " + tr.lang + ": " + tr.segments.length + " lines" +
          (tr.translated ? " (auto-translated from " + tr.source_lang + ")" :
           tr.generated ? " (auto-generated)" : "") +
          "  line " + lastIdx[k]
        ).join("\n");
        debugEl.textContent =
          "video: " + videoId + "   sync: " + (syncOn ? "on" : "off") + "\n" +
          "server t: " + base.t.toFixed(1) + "   playing: " + base.playing + "\n" +
          "display t: " + t.toFixed(1) + "\n" +
          "polls ok: " + pollCount + "   last: " + ((performance.now() - lastPollAt) / 1000).toFixed(1) + "s ago\n" +
          "tracks:\n" + trackInfo + "\n" +
          (lastError ? "error: " + lastError : "");
      }
      requestAnimationFrame(render);
    }

    document.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    });

    setInterval(poll, 250);
    render();
  </script>
</body>
</html>
