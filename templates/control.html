<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caption Controller</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #bar { display: flex; gap: 8px; padding: 10px; max-width: 720px; margin: 0 auto; }
    #bar input { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; font-size: 16px; }
    #status { padding: 6px 12px; text-align: center; color: #9cf; min-height: 1.2em; }
    #status.error { color: #f77; }
    #playerWrap {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16 / 9;
      margin: 0 auto;
      background: #000;
    }
    #playerWrap iframe { width: 100%; height: 100%; border: 0; }
    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      max-width: 720px;
      margin: 0 auto;
    }
    #seek { flex: 1; height: 32px; }
    #time { font-family: monospace; min-width: 110px; text-align: right; }
    #caption {
      padding: 12px 20px;
      text-align: center;
      font-size: 20px;
      color: #bbb;
      min-height: 3em;
    }
  </style>
</head>
<body>
  <div id="bar">
    <input id="videoUrl" type="text" placeholder="YouTube URL or ID" />
    <button onclick="load()">Load</button>
  </div>
  <div id="status"></div>

  <div id="playerWrap"><div id="player"></div></div>

  <div id="controls">
    <button onclick="skip(-10)">-10</button>
    <button id="playBtn" onclick="togglePlay()">Play</button>
    <button onclick="skip(10)">+10</button>
    <input id="seek" type="range" min="0" max="0" step="1" value="0" />
    <span id="time">0:00 / 0:00</span>
  </div>

  <div id="caption"></div>

  <script>
    let player = null;
    let apiReady = false;
    let currentId = null;
    let segments = [];
    let lastIdx = -2;
    let dragging = false;

    const statusEl = document.getElementById("status");
    const captionEl = document.getElementById("caption");
    const seekEl = document.getElementById("seek");
    const timeEl = document.getElementById("time");
    const playBtn = document.getElementById("playBtn");

    // Called by the YouTube IFrame API script when it has finished loading
    window.onYouTubeIframeAPIReady = () => {
      apiReady = true;
      setStatus("YouTube player ready.");
    };

    // Called if the YouTube script itself could not be downloaded
    function apiFailed() {
      setStatus("Could not download the YouTube player script. Check this device's internet connection and any ad blocker or privacy extension.", true);
    }

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className = isError ? "error" : "";
    }

    function fmt(s) {
      s = Math.floor(s);
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return m + ":" + String(sec).padStart(2, "0");
    }

    function playerReady() {
      return player && typeof player.getCurrentTime === "function";
    }

    async function load() {
      const url = document.getElementById("videoUrl").value.trim();
      if (!url) return;

      // The API may be loaded even if the ready callback was missed
      if (!apiReady && window.YT && YT.Player) apiReady = true;

      // Otherwise wait up to 10 seconds for it
      if (!apiReady) {
        setStatus("Waiting for the YouTube player to load...");
        for (let i = 0; i < 50 && !apiReady; i++) {
          await new Promise(r => setTimeout(r, 200));
          if (window.YT && YT.Player) apiReady = true;
        }
        if (!apiReady) {
          setStatus("The YouTube player script did not load. Open the browser console (F12) and check for blocked requests to youtube.com.", true);
          return;
        }
      }

      setStatus("Fetching captions...");
      let data;
      try {
        const res = await fetch("/api/captions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        data = await res.json();
        if (!res.ok) {
          setStatus(data.error || "Failed to load captions.", true);
          return;
        }
      } catch (e) {
        setStatus("Could not reach the server.", true);
        return;
      }

      segments = data.segments;
      lastIdx = -2;
      captionEl.textContent = "";
      currentId = data.video_id;
      const info = (data.tracks || []).map(t =>
        t.lang + ": " + t.segments.length + " lines" +
        (t.translated ? " (auto-translated from " + t.source_lang + ")" : "")
      ).join(", ");
      const missing = (data.missing && data.missing.length)
        ? " Not available: " + data.missing.map(l =>
            l + (data.errors && data.errors[l] ? " (" + data.errors[l] + ")" : "")
          ).join("; ") + "."
        : "";
      setStatus("Loaded " + (info || segments.length + " lines") + "." + missing);

      if (player) {
        player.loadVideoById(currentId);
      } else {
        player = new YT.Player("player", {
          videoId: currentId,
          width: "100%",
          height: "100%",
          playerVars: { playsinline: 1 }
        });
      }
    }

    function togglePlay() {
      if (!playerReady()) return;
      if (player.getPlayerState() === 1) player.pauseVideo();
      else player.playVideo();
    }

    function skip(delta) {
      if (!playerReady()) return;
      player.seekTo(Math.max(0, player.getCurrentTime() + delta), true);
    }

    // Slider: while dragging only update the label, seek when released
    seekEl.addEventListener("input", () => {
      dragging = true;
      timeEl.textContent = fmt(seekEl.value) + " / " + fmt(seekEl.max);
    });
    seekEl.addEventListener("change", () => {
      if (playerReady()) player.seekTo(Number(seekEl.value), true);
      dragging = false;
    });

    // Binary search: last segment whose start time is <= t
    function findIndex(t) {
      let lo = 0, hi = segments.length - 1, ans = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (segments[mid].seconds <= t) { ans = mid; lo = mid + 1; }
        else hi = mid - 1;
      }
      return ans;
    }

    // Runs every 100 ms: updates the caption preview and the controls
    function tick() {
      if (!playerReady()) return;
      const t = player.getCurrentTime();

      let i = findIndex(t);
      if (i >= 0 && t > segments[i].seconds + segments[i].duration) i = -1;
      if (i !== lastIdx) {
        lastIdx = i;
        captionEl.textContent = i >= 0 ? segments[i].text : "";
      }

      const dur = player.getDuration() || 0;
      if (dur && Number(seekEl.max) !== Math.floor(dur)) seekEl.max = Math.floor(dur);
      if (!dragging) {
        seekEl.value = Math.floor(t);
        timeEl.textContent = fmt(t) + " / " + fmt(dur);
      }
      playBtn.textContent = player.getPlayerState() === 1 ? "Pause" : "Play";
    }

    // Runs every 250 ms: tells the server where playback is
    function push() {
      if (!playerReady() || !currentId) return;
      fetch("/api/state", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          video_id: currentId,
          t: player.getCurrentTime(),
          playing: player.getPlayerState() === 1,
          rate: player.getPlaybackRate()
        })
      }).catch(() => {});
    }

    setStatus("Loading YouTube player...");
    setInterval(tick, 100);
    setInterval(push, 250);
  </script>

  <!-- Loaded after the script above so onYouTubeIframeAPIReady already exists -->
  <script src="https://www.youtube.com/iframe_api" onerror="apiFailed()"></script>
</body>
</html>
