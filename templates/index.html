<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YouTube Captions Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      background: #fafafa;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 20px;
      font-size: 15px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #333; }
    #status { margin-bottom: 15px; font-weight: 500; }
    .error { color: #d32f2f; }
    .caption-box {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      max-height: 500px;
      overflow-y: auto;
      padding: 15px;
    }
    .segment {
      display: flex;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .timestamp {
      font-family: monospace;
      color: #0066cc;
      min-width: 65px;
      text-decoration: none;
    }
    .text { flex: 1; line-height: 1.4; }
  </style>
</head>
<body>
  <h2>YouTube Caption Inspector</h2>
  
  <div class="input-group">
    <input id="videoUrl" type="text" placeholder="Paste YouTube URL or ID (e.g., https://youtu.be/...)" />
    <button id="fetchBtn" onclick="fetchCaptions()">Load Captions</button>
  </div>

  <div id="status"></div>
  <div id="results" class="caption-box" style="display: none;"></div>

  <script>
    async function fetchCaptions() {
      const url = document.getElementById("videoUrl").value.trim();
      const statusDiv = document.getElementById("status");
      const resultsDiv = document.getElementById("results");

      if (!url) return;

      statusDiv.className = "";
      statusDiv.textContent = "Fetching captions...";
      resultsDiv.style.display = "none";
      resultsDiv.innerHTML = "";

      try {
        const res = await fetch("/api/captions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (!res.ok) {
          statusDiv.className = "error";
          statusDiv.textContent = data.error || "Failed to load captions.";
          return;
        }

        statusDiv.textContent = `Found ${data.segments.length} caption lines for ID: ${data.video_id}`;
        
        resultsDiv.innerHTML = data.segments.map(seg => `
          <div class="segment">
            <a class="timestamp" href="https://youtu.be/${data.video_id}?t=${Math.floor(seg.seconds)}" target="_blank">${seg.time}</a>
            <span class="text">${seg.text}</span>
          </div>
        `).join("");
        
        resultsDiv.style.display = "block";
      } catch (err) {
        statusDiv.className = "error";
        statusDiv.textContent = "Error connecting to local server.";
      }
    }
  </script>
</body>
</html>
